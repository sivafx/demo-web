<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSphere - E-Commerce QA Demo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="logo" onclick="go('home')">ShopSphere</div>
  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="Search products..." autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>
  <nav>
    <button onclick="go('home')">Home</button>
    <button onclick="go('products')">Products</button>
    <button onclick="go('wishlist')">Wishlist <span id="wishCount">0</span></button>
    <button onclick="go('cart')">Cart <span id="cartCount">0</span></button>
    <button id="accountBtn" onclick="go('account')">Account</button>
  </nav>
</header>

<div id="banner" class="banner">
  <div>
    <h2>Summer Sale</h2>
    <p>Save up to 30% on selected products.</p>
    <button class="primary" onclick="go('products')">Shop Now</button>
  </div>
</div>

<main id="app"></main>

<div id="toast" class="toast"></div>

<footer>
  <div><strong>ShopSphere</strong><p>Demo e-commerce application for software testing practice.</p></div>
  <div><strong>Customer Service</strong><p>Help &nbsp; Returns &nbsp; Contact</p></div>
  <div><strong>Quick Links</strong><p>Privacy &nbsp; Terms &nbsp; Accessibility</p></div>
</footer>

<script src="app.js"></script>
</body>
</html>
